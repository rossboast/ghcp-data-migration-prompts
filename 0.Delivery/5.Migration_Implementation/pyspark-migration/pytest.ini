# pytest configuration for PySpark Migration Framework
# https://docs.pytest.org/en/stable/reference/customize.html

[pytest]

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers - define custom markers to avoid warnings
markers =
    integration: Integration tests requiring real databases (Oracle, Cosmos DB)
    oracle: Tests requiring Oracle database connection
    cosmos: Tests requiring Cosmos DB connection
    slow: Tests that take significant time to run (>5 seconds)
    docker: Tests that use Docker containers
    unit: Fast unit tests with mocked dependencies
    spark: Tests requiring PySpark installation

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Minimum version
minversion = 7.0

# Console output style
console_output_style = progress

# Log output
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout (seconds) - optional, requires pytest-timeout
# timeout = 300

# Coverage options (if using pytest-cov)
# addopts = --cov=extractors --cov=loaders --cov=transformers --cov=validators --cov=utils --cov-report=html --cov-report=term

# Environment variables (for documentation purposes)
# Set these in your shell or .env file:
#
# RUN_INTEGRATION_TESTS=true       Enable integration tests
# USE_DOCKER_ORACLE=true            Auto-manage Oracle via Docker
# ORACLE_AUTO_CLEANUP=true          Remove Docker container after tests
# ORACLE_DOCKER_IMAGE=...           Custom Oracle Docker image
# ORACLE_CONTAINER_NAME=...         Custom container name
# ORACLE_PORT=1521                  Custom host port mapping
# ORACLE_PASSWORD=...               Custom Oracle password
